<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Revify</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#07080a; --surface:#0e1014; --border:rgba(255,255,255,0.07); --accent:#c8f55a; --text:#e8eaed; --muted:#6b7280; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 3rem 2.5rem; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; margin-bottom: 2rem; }
    .logo span { color: var(--accent); }
    h1 { font-family: 'Instrument Serif', serif; font-size: 1.75rem; margin-bottom: 0.4rem; }
    p { color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; font-weight: 300; }
    label { display: block; font-size: 0.78rem; font-weight: 500; margin-bottom: 0.4rem; }
    input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; margin-bottom: 1.25rem; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: rgba(200,245,90,0.4); }
    button { width: 100%; background: var(--accent); color: #07080a; border: none; border-radius: 10px; padding: 0.85rem; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 0.5rem; }
    .flash-msg { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.85rem; color: #fca5a5; }
    .sub { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--muted); }
    .sub a { color: var(--accent); text-decoration: none; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><a href="/">Revify<span>.</span></a></div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-msg">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <h1>Create your account</h1>
    <p>Free forever for your first business. No credit card needed.</p>

    <form method="POST" action="/register">
      <div class="row">
        <div>
          <label>First name</label>
          <input type="text" name="first_name" placeholder="Rahul" required />
        </div>
        <div>
          <label>Last name</label>
          <input type="text" name="last_name" placeholder="Sharma" required />
        </div>
      </div>

      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required />

      <label>Business name</label>
      <input type="text" name="business_name" placeholder="Sharma's Bakery" required />

      <label>Password</label>
      <input type="password" name="password" placeholder="Min. 8 characters" required />

      <button type="submit">Create free account →</button>
    </form>

    <p class="sub">Already have an account? <a href="/login">Log in</a></p>
  </div>
</body>
</html>
